# cluster
easychat.cluster.node-id=${EASYCHAT_CLUSTER_NODE_ID:}
easychat.cluster.internal-host=${EASYCHAT_CLUSTER_INTERNAL_HOST:127.0.0.1}
easychat.cluster.internal-port=${EASYCHAT_CLUSTER_INTERNAL_PORT:${server.port}}
easychat.cluster.ws-port=${EASYCHAT_CLUSTER_WS_PORT:${ws.port}}
easychat.cluster.node-ttl-seconds=${EASYCHAT_CLUSTER_NODE_TTL_SECONDS:30}
easychat.cluster.node-heartbeat-seconds=${EASYCHAT_CLUSTER_NODE_HEARTBEAT_SECONDS:10}
easychat.cluster.presence-ttl-seconds=${EASYCHAT_CLUSTER_PRESENCE_TTL_SECONDS:90}
easychat.cluster.internal-secret=${EASYCHAT_CLUSTER_INTERNAL_SECRET:}
easychat.cluster.internal-allowed-ips=${EASYCHAT_CLUSTER_INTERNAL_ALLOWED_IPS:127.0.0.1,::1}
easychat.cluster.internal-request-max-age-seconds=${EASYCHAT_CLUSTER_INTERNAL_REQUEST_MAX_AGE_SECONDS:30}

# Kafka and reliable message delivery
spring.kafka.bootstrap-servers=${EASYCHAT_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.acks=all
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=latest
easychat.kafka.push-topic=${EASYCHAT_KAFKA_PUSH_TOPIC:easychat.push.event}
easychat.kafka.consumer-group-prefix=${EASYCHAT_KAFKA_CONSUMER_GROUP_PREFIX:easychat-push}
easychat.kafka.consumer-retry-attempts=${EASYCHAT_KAFKA_CONSUMER_RETRY_ATTEMPTS:3}
easychat.kafka.consumer-retry-interval-millis=${EASYCHAT_KAFKA_CONSUMER_RETRY_INTERVAL_MILLIS:1000}
easychat.outbox.scan-interval-millis=${EASYCHAT_OUTBOX_SCAN_INTERVAL_MILLIS:1000}
easychat.outbox.batch-size=${EASYCHAT_OUTBOX_BATCH_SIZE:100}
easychat.outbox.lease-seconds=${EASYCHAT_OUTBOX_LEASE_SECONDS:30}
easychat.outbox.max-retry-count=${EASYCHAT_OUTBOX_MAX_RETRY_COUNT:10}
easychat.outbox.initial-backoff-millis=${EASYCHAT_OUTBOX_INITIAL_BACKOFF_MILLIS:1000}
easychat.outbox.max-backoff-millis=${EASYCHAT_OUTBOX_MAX_BACKOFF_MILLIS:300000}

